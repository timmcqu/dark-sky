<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payment received — Dark Sky Systems</title>
  <link rel="stylesheet" href="style.css?v=91" />
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <a class="brand" href="index.html">Dark Sky Systems</a>
      <nav class="rail" aria-label="Primary">
        <a href="index.html#plans">Plans</a>
        <a href="index.html#request">Talk to us</a>
      </nav>
    </div>
  </header>
  <section class="page-hero wrap">
    <p class="eyebrow">Checkout</p>
    <h1>Payment received.</h1>
    <p class="lede" id="paidLede">Deposit lands in Dark Sky Systems LLC.</p>
    <div id="deliver" class="plans-cta"></div>
    <p class="plans-cta">
      <a class="cta cta-ghost" href="pay.html?sku=basic_m">Start monitoring</a>
      <a class="cta cta-ghost" href="index.html">Home</a>
    </p>
  </section>
  <footer class="foot">
    <div class="wrap">
      <p><strong>Dark Sky Systems LLC</strong> · darksky.systems</p>
      <p>We listen. We do not jam, spoof, or intercept.</p>
    </div>
  </footer>
  <script>
    var names = {
      soft: "Detect Drones", radio: "Detect Drones + Radios",
      basic_m: "Monitoring · Basic", pro_m: "Monitoring · Pro",
      campus: "Campus & Facility Assurance", build: "Construction Progress",
      venue: "Venue & Event Season", event_package: "Single-Event Airspace Awareness",
      risk_report: "Unauthorized Drone Risk Assessment Report",
      obs_templates: "Observation File Template Pack",
      training_pack: "Airspace Awareness Essentials",
      airspace_report: "Named Location Airspace Awareness Report",
      eap_pack: "Emergency Action Plan Pack"
    };
    var sku = new URLSearchParams(location.search).get("sku") || "";
    var label = names[sku];
    var lede = document.getElementById("paidLede");
    var box = document.getElementById("deliver");
    if (label) lede.textContent = label + ". Deposit lands in Dark Sky Systems LLC.";
    if (sku === "eap_pack") {
      lede.textContent = "Your Emergency Action Plan Pack is ready. Download the PDF and the editable file. Keep them with the written EAP.";
      box.innerHTML = '<a class="cta" href="deliver/eap-pack.pdf">Download the EAP Pack PDF</a><a class="cta cta-ghost" href="deliver/eap-pack-editable.html">Open the editable file</a>';
    } else if (sku === "obs_templates") {
      lede.textContent = "Your templates are ready. Click download. Keep the pack with the site plan.";
      box.innerHTML = '<a class="cta" id="goFile" href="deliver/obs-pack.pdf">Download Templates Now</a>';
    } else if (sku === "training_pack") {
      lede.textContent = "Your training pack is ready. Click download, print the checklists, keep them with the abort board.";
      box.innerHTML = '<a class="cta" id="goFile" href="deliver/training-pack.pdf">Download the Training Pack</a>';
    } else if (sku === "risk_report") {
      lede.textContent = "Your risk report is ready. It opens next. Use Save as PDF in the print dialog.";
      box.innerHTML = '<a class="cta" href="report.html?sku=risk_report">Open the Full Report now</a>';
      window.location.replace("report.html?sku=risk_report");
    } else if (sku === "airspace_report") {
      lede.textContent = "Your named-location report is ready. It opens next. Use Save as PDF in the print dialog.";
      box.innerHTML = '<a class="cta" href="report.html?sku=airspace_report">Open Your Location Report now</a>';
      window.location.replace("report.html?sku=airspace_report");
    } else {
      lede.textContent = (label || "This order") + ". We email next steps to the address on the Stripe receipt. Deposit is in Dark Sky Systems LLC.";
    }
  </script>
</body>
</html>
